[package]
name = "mesh-llm-memory-envelope"
version.workspace = true
edition = "2024"
license.workspace = true
description = "Runtime memory envelope measurement tool for Mesh-LLM distributed inference"
repository = "https://github.com/Mesh-LLM/mesh-llm"
homepage = "https://github.com/Mesh-LLM/mesh-llm"
readme = "README.md"

[[bin]]
name = "mesh-memory-envelope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = []
cuda = []
vulkan = []
